<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKPO - منصة العمل الرقمي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-area h1 {
            font-size: 32px;
            color: #38bdf8;
            font-weight: 800;
            letter-spacing: 2px;
        }
        .logo-area p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            background: #0f172a;
            border-radius: 10px;
            padding: 4px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #38bdf8;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            border-radius: 10px;
            color: #0f172a;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .form-container {
            display: none;
        }
        .form-container.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <h1>LKPO</h1>
            <p>منصتك الآمنة للاستثمار والإدارة</p>
        </div>

        <!-- أزرار التبديل بين التسجيل والدخول -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('register')">إنشاء حساب</button>
            <button class="tab-btn" onclick="switchTab('login')">تسجيل الدخول</button>
        </div>

        <!-- نموذج إنشاء حساب -->
        <div id="register-form" class="form-container active">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="example@gmail.com" required>
            </div>
            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>تأكيد كلمة السر</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>كود الإحالة (اختياري)</label>
                <input type="text" placeholder="أدخل كود الإحالة إن وجد">
            </div>
            <button class="submit-btn" onclick="alert('تم إنشاء الحساب بنجاح! رصيدك الابتدائي 0')">إنشاء الحساب</button>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <div id="login-form" class="form-container">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="example@gmail.com" required>
            </div>
            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button class="submit-btn" onclick="alert('تم تسجيل الدخول بنجاح!')">تسجيل الدخول</button>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // إزالة التنشيط عن الأزرار والنماذج
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));

            // تنشيط الزر والنموذج المحدد
            if (tabName === 'register') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            }
        }
    </script>

</body>
</html>
