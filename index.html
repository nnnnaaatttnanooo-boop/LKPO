<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة LKPO</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background-color: #121214; 
      color: #ffffff; 
      text-align: center; 
      padding: 20px; 
      margin: 0;
    }
    .card { 
      background: #1e2026; 
      padding: 25px; 
      margin: 20px auto; 
      max-width: 400px; 
      border-radius: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    input, button { 
      width: 90%; 
      padding: 12px; 
      margin: 10px 0; 
      border-radius: 6px; 
      border: 1px solid #2b2f36; 
      box-sizing: border-box;
      font-size: 15px;
    }
    input {
      background-color: #121214;
      color: #ffffff;
    }
    button { 
      background-color: #f0b90b; 
      color: #000; 
      font-weight: bold; 
      cursor: pointer; 
      border: none;
      transition: 0.3s;
    }
    button:hover {
      background-color: #d9a309;
    }
    .status { 
      color: #0ecb81; 
      font-weight: bold; 
    }
    hr {
      border: 0.5px solid #2b2f36;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <h1>منصة LKPO الاستثمارية</h1>

  <!-- 1. نموذج التسجيل وتسجيل الدخول -->
  <div class="card" id="auth-card">
    <h2>تسجيل الدخول / فتح حساب</h2>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="handleRegister()">فتح حساب جديد (رصيد $0)</button>
    <button onclick="handleLogin()">تسجيل الدخول</button>
  </div>

  <!-- 2. لوحة تحكم المستخدم بعد تسجيل الدخول -->
  <div class="card" id="user-card" style="display:none;">
    <h2>مرحباً، <span id="user-display-name"></span></h2>
    <p>الرصيد الحالي: <span class="status" id="user-balance">$0</span></p>
    <p>مستوى العضوية: <span class="status" id="user-vip">VIP1</span></p>

    <hr>

    <h3>طلب إيداع (لفتح مستوى VIP2)</h3>
    <input type="number" id="deposit-amount" placeholder="المبلغ المراد إيداعه ($)">
    <button onclick="handleDeposit()">إرسال طلب الإيداع</button>
    <button onclick="handleLogout()" style="background-color: #f6465d; color: #fff; margin-top: 15px;">تسجيل الخروج</button>
  </div>

  <script>
    // رابط السيرفر الخاص بك على Render
    const API_URL = "https://lkpo.onrender.com";

    let currentUser = JSON.parse(localStorage.getItem('lkpo_user')) || null;

    // تشغيل التحديث فور فتح الصفحة
    window.onload = () => {
      if (currentUser) {
        updateUI();
      }
    };

    // أ. فتح حساب جديد (يبدأ بـ 0)
    async function handleRegister() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) return alert("يرجى إدخال اسم المستخدم وكلمة المرور");

      try {
        const res = await fetch(`${API_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        alert(data.message);
      } catch (err) {
        alert("خطأ في الاتصال بالسيرفر");
      }
    }

    // ب. تسجيل الدخول
    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) return alert("يرجى إدخال البيانات");

      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          currentUser = data.user;
          localStorage.setItem('lkpo_user', JSON.stringify(currentUser));
          updateUI();
          alert("تم تسجيل الدخول بنجاح!");
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert("خطأ في الاتصال بالسيرفر");
      }
    }

    // ج. طلب إيداع لفتح VIP2 وشحن الرصيد
    async function handleDeposit() {
      const amount = parseFloat(document.getElementById('deposit-amount').value);
      if (!amount || amount <= 0) return alert("يرجى إدخال مبلغ صحيح");

      try {
        const res = await fetch(`${API_URL}/api/deposit/request`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUser._id, amount })
        });
        const data = await res.json();
        alert(data.message);
        document.getElementById('deposit-amount').value = '';
      } catch (err) {
        alert("خطأ أثناء إرسال طلب الإيداع");
      }
    }

    // د. تسجيل الخروج
    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('lkpo_user');
      document.getElementById('auth-card').style.display = 'block';
      document.getElementById('user-card').style.display = 'none';
    }

    // هـ. تحديث الواجهة
    function updateUI() {
      if (currentUser) {
        document.getElementById('auth-card').style.display = 'none';
        document.getElementById('user-card').style.display = 'block';
        document.getElementById('user-display-name').innerText = currentUser.username;
        document.getElementById('user-balance').innerText = `$${currentUser.balance}`;
        document.getElementById('user-vip').innerText = `VIP${currentUser.vipLevel}`;
      }
    }
  </script>

</body>
</html>
