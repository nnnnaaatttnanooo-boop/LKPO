<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة LKPO الاستثمارية</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #121214; 
      color: #ffffff; 
      text-align: center; 
      padding: 15px; 
      margin: 0;
    }
    .card { 
      background: #1e2026; 
      padding: 20px; 
      margin: 15px auto; 
      max-width: 450px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    input, button, select { 
      width: 90%; 
      padding: 12px; 
      margin: 8px 0; 
      border-radius: 8px; 
      border: 1px solid #2b2f36; 
      box-sizing: border-box;
      font-size: 15px;
    }
    input, select {
      background-color: #121214;
      color: #ffffff;
    }
    button { 
      background-color: #f0b90b; 
      color: #000; 
      font-weight: bold; 
      cursor: pointer; 
      border: none;
      transition: 0.3s;
    }
    button:hover {
      background-color: #d9a309;
    }
    .btn-danger {
      background-color: #f6465d;
      color: #fff;
    }
    .btn-danger:hover {
      background-color: #d9384f;
    }
    .status { 
      color: #0ecb81; 
      font-weight: bold; 
    }
    hr {
      border: 0.5px solid #2b2f36;
      margin: 15px 0;
    }
    /* جدول المستويات */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #2b2f36;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #2b2f36;
      color: #f0b90b;
    }
  </style>
</head>
<body>

  <h1>منصة LKPO الاستثمارية</h1>

  <!-- 1. نموذج التسجيل وتسجيل الدخول -->
  <div class="card" id="auth-card">
    <h2>تسجيل الدخول / فتح حساب</h2>
    <input type="text" id="username" placeholder="اسم المستخدم (البريد أو الهاتف)">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="handleRegister()">فتح حساب جديد (رصيد $0)</button>
    <button onclick="handleLogin()">تسجيل الدخول</button>
  </div>

  <!-- 2. لوحة تحكم المستخدم الرئيسي -->
  <div class="card" id="user-card" style="display:none;">
    <h2>مرحباً، <span id="user-display-name"></span></h2>
    <p>الرصيد الحالي: <span class="status" id="user-balance">$0</span></p>
    <p>مستوى العضوية: <span class="status" id="user-vip">VIP1</span></p>

    <hr>

    <!-- قسم الإيداع -->
    <h3>طلب إيداع جديد</h3>
    <input type="number" id="deposit-amount" placeholder="المبلغ المراد إيداعه ($)">
    <button onclick="handleDeposit()">إرسال طلب الإيداع للترقية/الشحن</button>

    <hr>

    <!-- جدول مستويات VIP -->
    <h3>مستويات VIP والأرباح</h3>
    <table>
      <thead>
        <tr>
          <th>المستوى</th>
          <th>الإيداع المطلوب</th>
          <th>الربح اليومي</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>VIP1</td><td>$0</td><td>افتراضي ($0)</td></tr>
        <tr><td>VIP2</td><td>$20</td><td>$2.00</td></tr>
        <tr><td>VIP3</td><td>$50</td><td>$5.50</td></tr>
        <tr><td>VIP4</td><td>$100</td><td>$12.00</td></tr>
        <tr><td>VIP5</td><td>$300</td><td>$38.00</td></tr>
        <tr><td>VIP6</td><td>$500</td><td>$65.00</td></tr>
      </tbody>
    </table>

    <hr>

    <button onclick="handleLogout()" class="btn-danger">تسجيل الخروج</button>
  </div>

  <script>
    const API_URL = "https://lkpo.onrender.com";

    let currentUser = JSON.parse(localStorage.getItem('lkpo_user')) || null;

    window.onload = () => {
      if (currentUser) {
        updateUI();
      }
    };

    // 1. فتح حساب جديد (يبدأ بـ $0 ورتبة VIP1)
    async function handleRegister() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) return alert("يرجى إدخال اسم المستخدم وكلمة المرور");

      try {
        const res = await fetch(`${API_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          alert(data.message || "تم إنشاء الحساب بنجاح!");
          currentUser = data.user;
          localStorage.setItem('lkpo_user', JSON.stringify(currentUser));
          updateUI();
        } else {
          alert(data.message || "فشلت عملية إنشاء الحساب");
        }
      } catch (err) {
        alert("خطأ في الاتصال بالسيرفر");
      }
    }

    // 2. تسجيل الدخول
    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) return alert("يرجى إدخال البيانات");

      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          currentUser = data.user;
          localStorage.setItem('lkpo_user', JSON.stringify(currentUser));
          alert(data.message || "تم تسجيل الدخول بنجاح!");
          updateUI();
        } else {
          alert(data.message || "فشلت عملية تسجيل الدخول");
        }
      } catch (err) {
        alert("خطأ في الاتصال بالسيرفر");
      }
    }

    // 3. إرسال طلب إيداع
    async function handleDeposit() {
      const amount = parseFloat(document.getElementById('deposit-amount').value);
      if (!amount || amount <= 0) return alert("يرجى إدخال مبلغ صحيح");

      try {
        const res = await fetch(`${API_URL}/api/deposit/request`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUser._id, amount })
        });
        const data = await res.json();
        alert(data.message || "تم إرسال طلب الإيداع بنجاح، بانتظار التأكيد");
        document.getElementById('deposit-amount').value = '';
      } catch (err) {
        alert("خطأ أثناء إرسال طلب الإيداع");
      }
    }

    // 4. تسجيل الخروج
    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('lkpo_user');
      document.getElementById('auth-card').style.display = 'block';
      document.getElementById('user-card').style.display = 'none';
    }

    // 5. تحديث عناصر الشاشة
    function updateUI() {
      if (currentUser) {
        document.getElementById('auth-card').style.display = 'none';
        document.getElementById('user-card').style.display = 'block';
        document.getElementById('user-display-name').innerText = currentUser.username;
        document.getElementById('user-balance').innerText = `$${currentUser.balance || 0}`;
        document.getElementById('user-vip').innerText = `VIP${currentUser.vipLevel || 1}`;
      }
    }
  </script>

</body>
</html>
